weights:
  # equal weights; the composite renormalises over whatever is non-None each cycle
  technicals: 0.33
  order_flow: 0.33
  volatility_regime: 0.33    # VIX/VIX9D term structure + VVIX - market-wide fear gauge

# Auto-pilot: automated paper entries (on/off lives in the DB, toggled from the
# dashboard - these are the tunables). Manual trading always stays available.
autopilot:
  tickers: [QQQ, SPY]           # only auto-enter these tickers (empty/absent = all polled tickers)
  # Only enter on signals at least this confident. What it's checked against is
  # set by calibration.gate_lower_bound_z - since 2026-10-09 the calibrated
  # band's POINT estimate again (z = 0), the rule the autopilot traded on until
  # 2026-09-25. History: lower bound >= 55 (09-25) and >= 50 (10-02) each went
  # a full week with zero trades - every band's lower bound sits below 50.
  min_confidence_pct: 55
  profit_target_pct: 50         # auto-set on every auto trade at entry
  stop_loss_pct: -35            # auto-set on every auto trade at entry (negative)
  risk_per_trade_pct: 5         # % of current balance risked per auto trade
  max_concurrent_positions: 3   # cap on simultaneously open AUTO positions
  max_trades_per_day: 4         # cap on auto entries per calendar day (market tz)
  cooldown_minutes: 30          # no re-entry in a ticker this soon after any close
  daily_loss_limit_pct: 10      # circuit breaker: stop for the day after losing this % of the account's equity at the open (balance + open positions) on auto trades
  no_entry_first_minutes: 30    # let the opening range form (continuous tactic)
  no_entry_last_minutes: 60     # don't open with too little runway before the bell
  tactic: opening_range         # opening_range = one deliberate decision per day-session; continuous = enter any time guard rails pass
  decision_start_minutes: 30    # opening_range: decision window opens this many minutes after open
  decision_end_minutes: 90      # opening_range: ...and closes this many minutes after open
  max_entries_per_session: 2    # opening_range: auto entries per session in total; never more than one per ticker (one QQQ + one SPY/day)
  no_entry_before_catalyst_minutes: 15  # stand down this close to a scheduled high-impact catalyst
  close_before_catalyst_minutes: 5      # don't hold into one: force-close AUTO positions (suggest for manual) this close to it (0 = off)
  positive_gamma_confidence_penalty: 10 # in a rangebound (positive-gamma) regime, require this much more confidence to auto-enter (0 = off)

# Shadow strategy lab: named virtual strategies traded on a paper-within-paper
# book every cycle (zero balance impact). Each = entry rule + exit rules; the
# leaderboard on the dashboard compares their track records. Per-ticker books -
# this tests entry/exit RULES, not portfolio selection. Stats need ~20-30
# trades before they mean anything (multiple-testing: with several strategies
# running, one will look great by luck early on).
# What a round trip costs beyond the bid-ask spread, charged on every paper
# close (real and lab) and in the research simulator. IBKR Pro tiered: about
# $0.65 a contract with a $1.00 minimum per order, plus exchange/regulatory
# fees (~$0.05 a contract per side, approximate). On one contract that is about
# $2.10 a round trip, more than the 1-cent spread. Verify against the first
# real statement and adjust. (Added 2026-10-20; earlier trades have no fees.)
costs:
  commission_per_contract: 0.65
  min_per_order: 1.00
  exchange_fee_per_contract: 0.05

# PRE-REGISTERED 2026-10-20: when the real autopilot should switch from the
# composite confidence gate (which the research found adds nothing) to the
# morning rule. Written down before the evidence arrives so it can't be bent to
# fit it. Meeting it switches nothing by itself - the Autopilot page says it's
# met, and the switch is a deliberate config change.
#
# NOTE 2026-10-20 (added after the deep-dive report, before any data; the rule
# itself is unchanged): at the simulated edge (+2-3% of premium a trade, about
# 40% standard deviation) 40 days give a standard error of ~6%, so the rule
# passes only ~5% of the time even if the edge is real (~2% if there is none).
# Read it as a LOSS DETECTOR and a cost-measurement window, not as proof of a
# profitable strategy; the real-quote replay is the test that can confirm one.
autopilot_promotion:
  candidate: morning_trail_1030   # the rule the autopilot would trade (the steadiest 2016-2026 pass)
  min_days: 40                    # days the morning family traded alongside the coin flip
  min_t: 2.0                      # the family's edge over the coin flip, per day
  candidate_net_positive: true    # and the candidate's own average P&L per trade > 0 (beats costs)

# Agents (added 2026-10-21): lab strategies trading their OWN paper money,
# beside the real autopilot and without touching its account. Each follows one
# shadow strategy's entry and exit rules (`entry`/`exit` here override them),
# buys risk_per_trade_pct of its own cash per trade (like the autopilot), and
# keeps the autopilot's guard rails: calendar check, no entry just before a
# high-impact catalyst, force-close just before one, daily loss limit. Its
# book is its own rows in the lab table; balance = starting_balance + realized
# P&L. Shown on the Autopilot page. The coin-flip agent is the control: same
# entry time, exits and sizing as the morning agent, no direction call - the
# morning agent has to beat it before its P&L means anything.
agents:
  - name: agent_morning
    label: Morning 10:30
    follows: morning_trail_1030
    about: "Follows the 10:00-10:30 move at 10:30 - the switch rule's candidate."
    starting_balance: 10000
    risk_per_trade_pct: 5
    daily_loss_limit_pct: 10
  - name: agent_coin
    label: Coin flip (control)
    follows: null_coin
    about: "Same time, exits and sizing as the morning agent; direction by coin flip."
    entry: { window_start_minutes: 61, window_end_minutes: 70 }
    starting_balance: 10000
    risk_per_trade_pct: 5
    daily_loss_limit_pct: 10

# The day lab fills became honest. Until then every option price came from
# Yahoo quotes 15 minutes behind the share price (PR #27, SIGNAL_RESEARCH.md),
# which flattered follow-the-signal strategies by ~$32 a trade. The lab
# leaderboard scores trades from this date by default; older ones stay
# viewable as "before", never mixed in.
lab_fills_honest_from: "2026-10-20"

shadow_strategies:
  # --- the autopilot's confidence gate, old vs new (added 2026-09-25) --------
  # Both mirror the real autopilot: QQQ/SPY, the 30-90 min window, the
  # positive-gamma penalty, and the exits an auto position gets. They differ
  # only in the gate: autopilot_point is the calibrated band's point estimate
  # >= 55 - the live rule until 2026-09-25 and again from 2026-10-09;
  # autopilot_lb is the band's 90% lower bound >= 50 - live 09-25..10-09 (at
  # 55, then 50), when it never traded. Same data, same fills - the
  # leaderboard settles which gate was right. reversal 101 = never: a reversal
  # only SUGGESTS an exit for an auto position, so the autopilot holds through
  # it. (Catalyst stand-downs and the global daily caps aren't mirrored.)
  - name: autopilot_point
    entry: { min_confidence_pct: 55, positive_gamma_confidence_penalty: 10,
             only_tickers: [QQQ, SPY], window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: autopilot_lb        # the strict rule, fixed: lower bound >= 50 whatever the live gate is
    entry: { confidence_basis: lower_bound, min_confidence_pct: 50,
             positive_gamma_confidence_penalty: 10,
             only_tickers: [QQQ, SPY], window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  # --- the null test (added 2026-10-10) --------------------------------------
  # Controls: the autopilot's window and exits with NO direction call. They
  # enter on the first cycle of the window, every session, every ticker.
  # null_call / null_put show what the market's drift alone paid; null_coin is
  # the directionless expectation (costs + exit mechanics). signal_ungated
  # follows the composite's direction with no confidence gate, so
  #   signal_ungated - null_coin   = what the direction call is worth
  #   autopilot_point - signal_ungated = what the confidence gate adds
  # (compare per ticker: autopilot_point only trades QQQ/SPY). A signal that
  # can't beat null_coin has no edge, whatever its own P&L says.
  - name: null_call
    entry: { direction_rule: always_call, min_confidence_pct: 0,
             window_start_minutes: 30, window_end_minutes: 90, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: null_put
    entry: { direction_rule: always_put, min_confidence_pct: 0,
             window_start_minutes: 30, window_end_minutes: 90, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: null_coin
    entry: { direction_rule: coin_flip, min_confidence_pct: 0,
             window_start_minutes: 30, window_end_minutes: 90, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: signal_ungated
    entry: { min_confidence_pct: 0,
             window_start_minutes: 30, window_end_minutes: 90, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  # --- PRE-REGISTERED morning signals (declared 2026-10-20) -------------------
  # From the signal research lab (SIGNAL_RESEARCH.md: 2016-2026 minute bars, 20
  # pre-declared tests against the autopilot's 10:00 trade). gap_behaviour
  # (follow) was the only pass: on days that gap a normal amount or more, trade
  # the direction of the 09:30-10:00 move - +3.0% of premium per trade over the
  # coin flip, t 2.93, positive in all four periods but fading (+0.3% since
  # 2025). orb15 (follow) was the runner-up (+2.3%, t 2.18). Computed at 10:00
  # by signals/morning.py with the research's own scoring functions; the
  # autopilot's exits. Read them against null_coin on honest fills only
  # (lab_fills_honest_from) - and don't tune them after seeing results.
  - name: morning_gap
    entry: { signal_source: gap_behaviour, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 31, window_end_minutes: 40, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: morning_orb
    entry: { signal_source: orb15, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 31, window_end_minutes: 40, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  # The intraday study (2026-10-20, 32 pre-declared tests at 10:30 / 11:30 /
  # 13:00 / 14:00) passed exactly two, both at 10:30: following the 10:00-10:30
  # move (+2.1%/trade, t 3.01, near-identical in every period) and the
  # opening-range breakout (+2.9%, t 3.19, stronger since 2022). Nothing passed
  # from 11:30 on. No weekday or event (Fed, CPI, jobs, expiry, month end,
  # mega-cap earnings) significantly breaks them. All four morning strategies
  # bet the same thing - the morning move continues - so they win and lose
  # together: read them as one confirmation, not four.
  - name: morning_trail_1030
    entry: { signal_source: trail30_1030, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 61, window_end_minutes: 70, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: morning_orb_1030
    entry: { signal_source: orb15_1030, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 61, window_end_minutes: 70, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  # --- PRE-REGISTERED 2026-10-21: one strike in the money vs at the money -----
  # Each morning strategy gets a twin that buys one listed strike deeper in the
  # money: same signal, same window, same exits. The deep-dive report (model,
  # not evidence) put a 1-strike-ITM option at ~1.6c of spread per unit of
  # delta vs ~2.0c ATM, with slower decay but less gamma. ONE confirmatory
  # test: ITM minus ATM, paired on the same ticker, signal and day
  # (research.py labstats, 'ITM vs ATM'). Compare on the underlying move too:
  # the same +50%/-35% needs a bigger share move on the ITM option. The twins
  # are not part of the morning family or the switch rule.
  - name: morning_gap_itm
    entry: { signal_source: gap_behaviour, strike: itm1, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 31, window_end_minutes: 40, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: morning_orb_itm
    entry: { signal_source: orb15, strike: itm1, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 31, window_end_minutes: 40, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: morning_trail_1030_itm
    entry: { signal_source: trail30_1030, strike: itm1, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 61, window_end_minutes: 70, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: morning_orb_1030_itm
    entry: { signal_source: orb15_1030, strike: itm1, only_tickers: [QQQ, SPY], min_confidence_pct: 0,
             window_start_minutes: 61, window_end_minutes: 70, no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  # --- PRE-REGISTERED 2026-10-21: the Fed-day volatility ramp ---------------
  # On Fed days the market's expected move rises from ~0.60% at 10:00 to ~0.78%
  # just before the 14:00 statement (Song 2026, SIGNAL_RESEARCH deep dive). A
  # 10:00 ATM straddle sold at 13:55 would gain from that ramp if the share
  # holds roughly still - and never holds through the statement. Run as a call
  # and a put on the same day; the test is the STRADDLE (call + put), read per
  # day with research.py labstats ('Fed-day ramp'). Fed days only (~8 a year),
  # no target or stop: the time cutoff (125 min before the close) is the exit.
  - name: fomc_ramp_call
    entry: { direction_rule: always_call, only_on: fomc, only_tickers: [QQQ, SPY],
             min_confidence_pct: 0, window_start_minutes: 30, window_end_minutes: 36,
             no_entry_last_minutes: 60 }
    exit: { time_cutoff_minutes_before_close: 125, reversal_confidence_pct: 101 }
  - name: fomc_ramp_put
    entry: { direction_rule: always_put, only_on: fomc, only_tickers: [QQQ, SPY],
             min_confidence_pct: 0, window_start_minutes: 30, window_end_minutes: 36,
             no_entry_last_minutes: 60 }
    exit: { time_cutoff_minutes_before_close: 125, reversal_confidence_pct: 101 }
  # --- PRE-REGISTERED single-signal hypotheses (declared 2026-07-17) ----------
  # An 18-cell sweep of signal x ticker over the first 11 days found NOTHING
  # significant: the best cell was SPY/technicals at 55.9% (z=+1.13), while pure
  # noise across 18 tests would typically produce a best z of ~+2.40. So 55.9%
  # is IN-SAMPLE data mining, not an edge.
  # Declaring it here converts it into a real out-of-sample test: if it still
  # holds after ~22 more trading days (n~384 needed to prove a 55% edge, SPY had
  # 92), that means something. If it regresses to 50%, that also means something.
  # Either way we learn - which is the entire point of writing it down first.
  # nvda_technicals is the control: the same rule on the cheap-spread ticker
  # (NVDA ~0.5% vs SPY ~15.4% round trip), where a real edge could survive costs.
  - name: spy_technicals
    entry: { signal_source: technicals, only_tickers: [SPY], min_confidence_pct: 20,
             window_start_minutes: 30, window_end_minutes: 240, no_entry_last_minutes: 60,
             max_entries_per_day: 2 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
# Retired 2026-10-20: settled, so they no longer take new trades (the worker
# still manages any position they hold until it closes). Their records stay in
# the database and on the Lab page under "Before". Why they were retired:
#  - the fades (contrarian, fade_conviction, inv_*) lose in every test we ran,
#    on paper and in the 2016-2026 research;
#  - the composite variants' paper edge was the 15-minute quote delay
#    (SIGNAL_RESEARCH.md: re-priced in real time they're ~zero);
#  - every extra live strategy makes a lucky "EDGE" more likely.
# To bring one back, move its entry up into shadow_strategies.
retired_shadow_strategies:
  # retired 2026-10-20 with the NVDA ticker
  - name: nvda_technicals
    entry: { signal_source: technicals, only_tickers: [NVDA], min_confidence_pct: 20,
             window_start_minutes: 30, window_end_minutes: 240, no_entry_last_minutes: 60,
             max_entries_per_day: 2 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }

  - name: baseline            # the autopilot's opening-range setup (predates the lower-bound gate)
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: confluence          # same window, but demands technicals agreement + non-positive gamma
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, require_agree: technicals, gamma_block: [positive] }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: runner              # let winners run: trailing stop instead of a profit target
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { stop_loss_pct: -35, trailing_activate_pct: 30, trailing_stop_pct: 15,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: quick_scalp         # tighter target/stop, wider window, up to 3 tries/day
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_entries_per_day: 3 }
    exit: { profit_target_pct: 25, stop_loss_pct: -20,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: afternoon           # tests the late-session entry idea the context tables hint at
    entry: { min_confidence_pct: 50, window_start_minutes: 180, window_end_minutes: 300,
             no_entry_last_minutes: 45 }
    exit: { profit_target_pct: 30, stop_loss_pct: -25,
            time_cutoff_minutes_before_close: 20, reversal_confidence_pct: 60 }
  # --- contrarian tests -------------------------------------------------------
  # The graded history says the composite's higher-confidence bands are LESS
  # accurate than its low ones (NVDA 60-100% band: 7% right over 14 samples;
  # IWM/TSLA 40-60% bands: 33-37%). If a band is reliably wrong, its inverse is
  # reliably right - these test that directly instead of theorising about it.
  - name: contrarian          # baseline's setup, opposite direction
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: fade_conviction     # fades ONLY the high-conviction band (the 7%-accurate one)
    entry: { min_confidence_pct: 60, window_start_minutes: 30, window_end_minutes: 240,
             no_entry_last_minutes: 60, invert: true, max_entries_per_day: 2 }
    exit: { profit_target_pct: 40, stop_loss_pct: -30,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: gamma_gate_only     # isolates the gamma gate: trade only non-rangebound days
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, gamma_block: [positive] }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  # --- does signal persistence mean anything? --------------------------------
  # The composite is memoryless: a 1-minute blip and a 40-minute conviction
  # produce an identical reading. These two test opposite hypotheses - settled
  # signal = real, vs fresh flip = new information.
  - name: persistent          # only trade a direction that has held ~10 min
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, min_direction_streak: 10 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: fresh_flip          # only trade a direction that JUST flipped
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_direction_streak: 2 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  # --- inverses (added 2026-09-24) -------------------------------------------
  # Each = the named strategy with invert: true, otherwise identical, so every
  # pair is a direct direction test. Read them TOGETHER: buying the opposite
  # option still pays the spread and theta, so if BOTH sides of a pair lose,
  # the losses are costs, not direction, and neither side has an edge.
  # (baseline's inverse is `contrarian` above; the pre-registered technicals
  # tests below are left alone so their out-of-sample test stays clean.)
  # More strategies = more lucky winners: expect ~1 false EDGE among these.
  - name: inv_confluence
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, require_agree: technicals, gamma_block: [positive],
             invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_runner
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, invert: true }
    exit: { stop_loss_pct: -35, trailing_activate_pct: 30, trailing_stop_pct: 15,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_quick_scalp
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_entries_per_day: 3, invert: true }
    exit: { profit_target_pct: 25, stop_loss_pct: -20,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_afternoon
    entry: { min_confidence_pct: 50, window_start_minutes: 180, window_end_minutes: 300,
             no_entry_last_minutes: 45, invert: true }
    exit: { profit_target_pct: 30, stop_loss_pct: -25,
            time_cutoff_minutes_before_close: 20, reversal_confidence_pct: 60 }
  - name: inv_gamma_gate_only
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, gamma_block: [positive], invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_persistent
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, min_direction_streak: 10, invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_fresh_flip
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_direction_streak: 2, invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }

# Dealer gamma exposure (GEX): a rangebound-vs-trending regime read computed from
# the option chain we already fetch. Not a directional signal - it gates the
# opening-range auto-entry (see autopilot.positive_gamma_confidence_penalty) and
# shows on the dashboard. Naive front-expiry approximation.
gamma:
  deadband: 0.15  # |normalized GEX| below this reads as 'neutral' (no strong lean)

# Automatic self-calibration: once per day after market close the worker
# nudges per-ticker weights toward the accuracy-based suggestion, flips
# reliably-wrong signals, and maps raw confidence to observed accuracy.
# On/off lives in the DB (dashboard toggle) - these are the tunables.
calibration:
  learning_rate: 0.25           # fraction of the suggested weight change applied per day
  inversion_cooldown_days: 5    # a category can't flip (or flip back) more often than this
  # Both counts below are INDEPENDENT observations (non-overlapping forward
  # windows), not raw graded minutes - see weight_suggestion_min_graded above.
  confidence_min_graded: 30     # independent composite calls needed before storing a confidence map
  band_min_count: 10            # independent calls a band needs before it recalibrates a raw confidence
  # What the autopilot's confidence gate checks: 0 = the band's point estimate
  # (the number shown on the Signals card); 1.645 = its one-sided 90% LOWER
  # bound (Wilson, over the band's independent calls).
  #
  # 0 since 2026-10-09, as a deliberate paper experiment. The lower bound is
  # the statistically honest gate - the estimate once let a raw 6% QQQ signal
  # through because its band read 56% over just 41 calls - but in two weeks no
  # band's lower bound ever cleared it, so the autopilot produced nothing to
  # learn from. The strict rule keeps running in the lab (autopilot_lb).
  gate_lower_bound_z: 0

exit_rules:
  profit_target_pct: 50
  stop_loss_pct: -30
  time_cutoff_minutes_before_close: 30
  reversal_confidence_pct: 60
  # Trailing stop: let a winner run, then lock it in. Once the premium has been
  # up trailing_activate_pct from entry, exit if it gives back trailing_stop_pct
  # from that peak. (Set either to null to disable.)
  trailing_activate_pct: 40
  trailing_stop_pct: 20
  # Theta-aware late-session stop: in the last late_session_minutes before the
  # close, cut a position still down at least late_session_stop_pct (0DTE decay
  # accelerates, so a lingering loser is usually dead premium). null to disable.
  late_session_minutes: 90
  late_session_stop_pct: -20

database:
  # The live database is OUTSIDE the OneDrive-synced project folder on purpose:
  # it's written every minute, and OneDrive locking it (or its -wal/-shm files)
  # mid-write can fail a commit, while its cloud copy is never a consistent
  # snapshot. ~ and %VARS% expand; a relative path is from the project root.
  # The Web Push key (vapid_private.pem) lives beside it. ZERODTE_DB_PATH
  # overrides this (tests, a second instance on a copy).
  #
  # NOT under AppData: Windows redirects a packaged app's writes to AppData into
  # a private per-app folder. Tools run from inside such an app (the Claude
  # desktop app, for one) would then see a different file than the scheduled
  # tasks - the first move to AppData\Local\0DTE did exactly that, and the
  # tasks started on an empty database.
  path: "~/0DTE-data/0dte.db"
  # Nightly backups stay in the synced folder: each is written once, closed and
  # never touched again, so OneDrive syncs them safely - off-machine copies.
  backup_dir: "storage/backups"
