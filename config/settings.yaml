# 0DTE Paper Trading Tool - tweakable configuration
# All weights, thresholds, and sizing here are intentionally arbitrary
# starting points per the project brief - tune once real paper-trading
# data accumulates.

tickers:
  - QQQ
  - SPY
  - IWM
  - TSLA  # mega-cap with daily (0DTE) options
  - NVDA  # mega-cap with daily (0DTE) options

# How often the worker polls every ticker, in seconds (15-600). The worker
# reads this at startup and records it in the database, where the web UI's
# staleness checks and streak labels pick it up - so a change takes effect on
# the next worker restart. Most other settings here (accuracy gating, the
# direction-streak shadow strategies) assume one poll a minute.
poll_interval_seconds: 60

market_hours:
  open: "09:30"
  close: "16:00"
  timezone: "America/New_York"

# NYSE full-closure holidays (source: nyse.com/trade/hours-calendars, which
# publishes three years ahead; re-checked 2026-09-25). Extend this list each
# year - the worker treats unlisted weekdays as normal trading days.
#
# market_holidays_through: the last date the holiday AND early-close lists are
# known complete for. From 30 days before it the web UI warns; after it the
# autopilot stands down (an unlisted holiday would read as a normal trading
# day), until the lists are extended and this date moved.
market_holidays_through: "2028-12-31"
market_holidays:
  - "2026-01-01"  # New Year's Day
  - "2026-01-19"  # Martin Luther King, Jr. Day
  - "2026-02-16"  # Washington's Birthday
  - "2026-04-03"  # Good Friday
  - "2026-05-25"  # Memorial Day
  - "2026-06-19"  # Juneteenth
  - "2026-07-03"  # Independence Day (observed - Jul 4 is a Saturday)
  - "2026-09-07"  # Labor Day
  - "2026-11-26"  # Thanksgiving
  - "2026-12-25"  # Christmas
  - "2027-01-01"  # New Year's Day
  - "2027-01-18"  # Martin Luther King, Jr. Day
  - "2027-02-15"  # Washington's Birthday
  - "2027-03-26"  # Good Friday
  - "2027-05-31"  # Memorial Day
  - "2027-06-18"  # Juneteenth (observed - Jun 19 is a Saturday)
  - "2027-07-05"  # Independence Day (observed - Jul 4 is a Sunday)
  - "2027-09-06"  # Labor Day
  - "2027-11-25"  # Thanksgiving
  - "2027-12-24"  # Christmas (observed - Dec 25 is a Saturday)
  # 2028: no New Year's holiday - Jan 1 is a Saturday and isn't observed
  - "2028-01-17"  # Martin Luther King, Jr. Day
  - "2028-02-21"  # Washington's Birthday
  - "2028-04-14"  # Good Friday
  - "2028-05-29"  # Memorial Day
  - "2028-06-19"  # Juneteenth
  - "2028-07-04"  # Independence Day
  - "2028-09-04"  # Labor Day
  - "2028-11-23"  # Thanksgiving
  - "2028-12-25"  # Christmas

# Early-close days: market closes at 13:00 ET instead of 16:00. Covered by
# market_holidays_through above.
market_half_days:
  - "2026-11-27"  # day after Thanksgiving
  - "2026-12-24"  # Christmas Eve
  - "2027-11-26"  # day after Thanksgiving
  - "2028-07-03"  # day before Independence Day
  - "2028-11-24"  # day after Thanksgiving

account:
  starting_balance: 10000
  risk_per_trade_pct: 5

confidence_floor_pct: 40

accuracy_horizon_minutes: 30  # how far ahead a signal's direction is graded against actual price movement
# How far back accuracy, the Tuning page and nightly calibration look (calendar
# days, ~21 sessions). Was an implicit 2,000-row cap = ~5.5 sessions at one poll
# a minute - too short to tell an edge from a lucky week.
accuracy_window_days: 30
# When the CURRENT composite definition took effect (market-tz date). Bump it
# whenever signals are added, removed or rescored: composite-level stats -
# overall accuracy, confidence bands, the calibration confidence map - only
# grade calls made from this date on, because an older composite was a
# different signal. Per-signal accuracy still uses the whole window.
composite_since: "2026-09-17"   # sentiment/greeks_iv/prediction_markets/trump_news dropped
# Min INDEPENDENT observations before a category is "proven" enough to reweight.
# Independent, not raw minutes: polling every minute but grading 30 minutes out
# means consecutive samples overlap ~29/30, and a signal that holds one direction
# all day made ONE call, not 390 (see analytics.accuracy.independent_observations).
# Counting raw minutes is what let trump_news - which has ~3 real observations in
# 11 days - collect half of IWM's composite weight. At 30, a fast signal
# technicals qualifies within a couple of weeks; a slow market-wide
# one correctly never does on its own.
weight_suggestion_min_graded: 30

# Categories whose score should be used contrarian (sign-flipped) - e.g. if the
# accuracy panel shows a signal is reliably wrong, listing it here makes its
# inverse contribute to the composite instead. Applies at the worker, so stored
# subscores and accuracy grading reflect the flipped signal.
invert_categories: []

# Pre-market "day setup": once per trading day before the open, the worker
# assembles the overnight gap, prior-day/overnight levels, today's catalysts,
# and an opening bias per ticker (stored in day_setups). Feeds the day-session
# auto-pilot (stand down near catalysts) and the dashboard.
premarket:
  window_minutes: 90            # how long before the open the setup pass runs (~08:00 ET)
  gap_bias_scale_pct: 0.5       # gap% that maps to a full +/-1 opening bias
  # (Index-futures proxies were removed: comparing an index-scale futures price
  # to an ETF's own close produced a +4023% gap and drew index-level overnight
  # highs/lows on the ETF chart. Each ticker now uses its own extended-hours
  # data, so everything is in that ticker's price units.)

# High-impact scheduled events, hand-maintained like market_holidays. The
# auto-pilot stands down near these and won't hold an auto position into one
# (dates + times in market tz). Sources (re-checked 2026-09-25):
#   FOMC  - federalreserve.gov/monetarypolicy/fomccalendars.htm; the decision
#           is the 2nd meeting day, 2:00pm ET. Each date stays tentative until
#           confirmed at the meeting before it.
#   CPI   - bls.gov/schedule/news_release/cpi.htm (8:30am ET)
#   Jobs  - bls.gov/schedule/news_release/empsit.htm (8:30am ET)
# BLS publishes each year's schedule late in the year before - add the 2027
# CPI and jobs dates when they appear, then move market_catalysts_through.
# Past dates are ignored.
#
# market_catalysts_through: the last date this list is known complete for (all
# three sources published). From 30 days before it the web UI warns; after it
# the autopilot stands down until the list is extended - an incomplete list
# would let it trade straight through a CPI or jobs morning. The 2027 FOMC
# dates below don't extend it: January's CPI and jobs dates are still unknown.
market_catalysts_through: "2026-12-31"
market_catalysts:
  - { date: "2026-07-29", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2026-08-07", time: "08:30", label: "Jobs report", impact: "high" }
  - { date: "2026-08-12", time: "08:30", label: "CPI",         impact: "high" }
  - { date: "2026-09-04", time: "08:30", label: "Jobs report", impact: "high" }
  - { date: "2026-09-11", time: "08:30", label: "CPI",         impact: "high" }
  - { date: "2026-09-16", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2026-10-02", time: "08:30", label: "Jobs report", impact: "high" }
  - { date: "2026-10-14", time: "08:30", label: "CPI",         impact: "high" }
  - { date: "2026-10-28", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2026-11-06", time: "08:30", label: "Jobs report", impact: "high" }
  - { date: "2026-11-10", time: "08:30", label: "CPI",         impact: "high" }
  - { date: "2026-12-04", time: "08:30", label: "Jobs report", impact: "high" }
  - { date: "2026-12-09", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2026-12-10", time: "08:30", label: "CPI",         impact: "high" }
  # 2027 - FOMC only so far (BLS hasn't published its 2027 schedules)
  - { date: "2027-01-27", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-03-17", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-04-28", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-06-09", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-07-28", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-09-15", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-10-27", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2027-12-08", time: "14:00", label: "FOMC",        impact: "high" }
  - { date: "2028-01-26", time: "14:00", label: "FOMC",        impact: "high" }

weights:
  # equal weights; the composite renormalises over whatever is non-None each cycle
  technicals: 0.33
  order_flow: 0.33
  volatility_regime: 0.33    # VIX/VIX9D term structure + VVIX - market-wide fear gauge

# Auto-pilot: automated paper entries (on/off lives in the DB, toggled from the
# dashboard - these are the tunables). Manual trading always stays available.
autopilot:
  tickers: [QQQ, SPY]           # only auto-enter these tickers (empty/absent = all polled tickers)
  min_confidence_pct: 55        # only enter on signals at least this confident (on calibrated maps, the band's lower bound - see calibration.gate_lower_bound_z)
  profit_target_pct: 50         # auto-set on every auto trade at entry
  stop_loss_pct: -35            # auto-set on every auto trade at entry (negative)
  risk_per_trade_pct: 5         # % of current balance risked per auto trade
  max_concurrent_positions: 3   # cap on simultaneously open AUTO positions
  max_trades_per_day: 4         # cap on auto entries per calendar day (market tz)
  cooldown_minutes: 30          # no re-entry in a ticker this soon after any close
  daily_loss_limit_pct: 10      # circuit breaker: stop for the day after losing this % of the account's equity at the open (balance + open positions) on auto trades
  no_entry_first_minutes: 30    # let the opening range form (continuous tactic)
  no_entry_last_minutes: 60     # don't open with too little runway before the bell
  tactic: opening_range         # opening_range = one deliberate decision per day-session; continuous = enter any time guard rails pass
  decision_start_minutes: 30    # opening_range: decision window opens this many minutes after open
  decision_end_minutes: 90      # opening_range: ...and closes this many minutes after open
  max_entries_per_session: 2    # opening_range: best trade per allowed ticker (one QQQ + one SPY/day)
  no_entry_before_catalyst_minutes: 15  # stand down this close to a scheduled high-impact catalyst
  close_before_catalyst_minutes: 5      # don't hold into one: force-close AUTO positions (suggest for manual) this close to it (0 = off)
  positive_gamma_confidence_penalty: 10 # in a rangebound (positive-gamma) regime, require this much more confidence to auto-enter (0 = off)

# Shadow strategy lab: named virtual strategies traded on a paper-within-paper
# book every cycle (zero balance impact). Each = entry rule + exit rules; the
# leaderboard on the dashboard compares their track records. Per-ticker books -
# this tests entry/exit RULES, not portfolio selection. Stats need ~20-30
# trades before they mean anything (multiple-testing: with several strategies
# running, one will look great by luck early on).
shadow_strategies:
  # --- the autopilot's confidence gate, old vs new (added 2026-09-25) --------
  # Both mirror the real autopilot: QQQ/SPY, the 30-90 min window, the
  # positive-gamma penalty, and the exits an auto position gets. They differ
  # only in the confidence the 55% gate checks: autopilot_point is the rule it
  # traded on until 2026-09-25 (the calibrated band's point estimate),
  # autopilot_lb the lower bound it uses now. Same data, same fills - the
  # leaderboard settles which gate was right. reversal 101 = never: a reversal
  # only SUGGESTS an exit for an auto position, so the autopilot holds through
  # it. (Catalyst stand-downs and the global daily caps aren't mirrored.)
  - name: autopilot_point
    entry: { min_confidence_pct: 55, positive_gamma_confidence_penalty: 10,
             only_tickers: [QQQ, SPY], window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: autopilot_lb
    entry: { confidence_basis: gate, min_confidence_pct: 55,
             positive_gamma_confidence_penalty: 10,
             only_tickers: [QQQ, SPY], window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35, time_cutoff_minutes_before_close: 30,
            reversal_confidence_pct: 101, trailing_activate_pct: 40, trailing_stop_pct: 20,
            late_session_minutes: 90, late_session_stop_pct: -20 }
  - name: baseline            # the autopilot's opening-range setup (predates the lower-bound gate)
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: confluence          # same window, but demands technicals agreement + non-positive gamma
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, require_agree: technicals, gamma_block: [positive] }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: runner              # let winners run: trailing stop instead of a profit target
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60 }
    exit: { stop_loss_pct: -35, trailing_activate_pct: 30, trailing_stop_pct: 15,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: quick_scalp         # tighter target/stop, wider window, up to 3 tries/day
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_entries_per_day: 3 }
    exit: { profit_target_pct: 25, stop_loss_pct: -20,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: afternoon           # tests the late-session entry idea the context tables hint at
    entry: { min_confidence_pct: 50, window_start_minutes: 180, window_end_minutes: 300,
             no_entry_last_minutes: 45 }
    exit: { profit_target_pct: 30, stop_loss_pct: -25,
            time_cutoff_minutes_before_close: 20, reversal_confidence_pct: 60 }
  # --- contrarian tests -------------------------------------------------------
  # The graded history says the composite's higher-confidence bands are LESS
  # accurate than its low ones (NVDA 60-100% band: 7% right over 14 samples;
  # IWM/TSLA 40-60% bands: 33-37%). If a band is reliably wrong, its inverse is
  # reliably right - these test that directly instead of theorising about it.
  - name: contrarian          # baseline's setup, opposite direction
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: fade_conviction     # fades ONLY the high-conviction band (the 7%-accurate one)
    entry: { min_confidence_pct: 60, window_start_minutes: 30, window_end_minutes: 240,
             no_entry_last_minutes: 60, invert: true, max_entries_per_day: 2 }
    exit: { profit_target_pct: 40, stop_loss_pct: -30,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: gamma_gate_only     # isolates the gamma gate: trade only non-rangebound days
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, gamma_block: [positive] }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  # --- does signal persistence mean anything? --------------------------------
  # The composite is memoryless: a 1-minute blip and a 40-minute conviction
  # produce an identical reading. These two test opposite hypotheses - settled
  # signal = real, vs fresh flip = new information.
  - name: persistent          # only trade a direction that has held ~10 min
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, min_direction_streak: 10 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: fresh_flip          # only trade a direction that JUST flipped
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_direction_streak: 2 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  # --- inverses (added 2026-09-24) -------------------------------------------
  # Each = the named strategy with invert: true, otherwise identical, so every
  # pair is a direct direction test. Read them TOGETHER: buying the opposite
  # option still pays the spread and theta, so if BOTH sides of a pair lose,
  # the losses are costs, not direction, and neither side has an edge.
  # (baseline's inverse is `contrarian` above; the pre-registered technicals
  # tests below are left alone so their out-of-sample test stays clean.)
  # More strategies = more lucky winners: expect ~1 false EDGE among these.
  - name: inv_confluence
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, require_agree: technicals, gamma_block: [positive],
             invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_runner
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 90,
             no_entry_last_minutes: 60, invert: true }
    exit: { stop_loss_pct: -35, trailing_activate_pct: 30, trailing_stop_pct: 15,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_quick_scalp
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_entries_per_day: 3, invert: true }
    exit: { profit_target_pct: 25, stop_loss_pct: -20,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_afternoon
    entry: { min_confidence_pct: 50, window_start_minutes: 180, window_end_minutes: 300,
             no_entry_last_minutes: 45, invert: true }
    exit: { profit_target_pct: 30, stop_loss_pct: -25,
            time_cutoff_minutes_before_close: 20, reversal_confidence_pct: 60 }
  - name: inv_gamma_gate_only
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, gamma_block: [positive], invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_persistent
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, min_direction_streak: 10, invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: inv_fresh_flip
    entry: { min_confidence_pct: 55, window_start_minutes: 30, window_end_minutes: 180,
             no_entry_last_minutes: 60, max_direction_streak: 2, invert: true }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  # --- PRE-REGISTERED single-signal hypotheses (declared 2026-07-17) ----------
  # An 18-cell sweep of signal x ticker over the first 11 days found NOTHING
  # significant: the best cell was SPY/technicals at 55.9% (z=+1.13), while pure
  # noise across 18 tests would typically produce a best z of ~+2.40. So 55.9%
  # is IN-SAMPLE data mining, not an edge.
  # Declaring it here converts it into a real out-of-sample test: if it still
  # holds after ~22 more trading days (n~384 needed to prove a 55% edge, SPY had
  # 92), that means something. If it regresses to 50%, that also means something.
  # Either way we learn - which is the entire point of writing it down first.
  # nvda_technicals is the control: the same rule on the cheap-spread ticker
  # (NVDA ~0.5% vs SPY ~15.4% round trip), where a real edge could survive costs.
  - name: spy_technicals
    entry: { signal_source: technicals, only_tickers: [SPY], min_confidence_pct: 20,
             window_start_minutes: 30, window_end_minutes: 240, no_entry_last_minutes: 60,
             max_entries_per_day: 2 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }
  - name: nvda_technicals
    entry: { signal_source: technicals, only_tickers: [NVDA], min_confidence_pct: 20,
             window_start_minutes: 30, window_end_minutes: 240, no_entry_last_minutes: 60,
             max_entries_per_day: 2 }
    exit: { profit_target_pct: 50, stop_loss_pct: -35,
            time_cutoff_minutes_before_close: 30, reversal_confidence_pct: 60 }

# Dealer gamma exposure (GEX): a rangebound-vs-trending regime read computed from
# the option chain we already fetch. Not a directional signal - it gates the
# opening-range auto-entry (see autopilot.positive_gamma_confidence_penalty) and
# shows on the dashboard. Naive front-expiry approximation.
gamma:
  deadband: 0.15  # |normalized GEX| below this reads as 'neutral' (no strong lean)

# Automatic self-calibration: once per day after market close the worker
# nudges per-ticker weights toward the accuracy-based suggestion, flips
# reliably-wrong signals, and maps raw confidence to observed accuracy.
# On/off lives in the DB (dashboard toggle) - these are the tunables.
calibration:
  learning_rate: 0.25           # fraction of the suggested weight change applied per day
  inversion_cooldown_days: 5    # a category can't flip (or flip back) more often than this
  # Both counts below are INDEPENDENT observations (non-overlapping forward
  # windows), not raw graded minutes - see weight_suggestion_min_graded above.
  confidence_min_graded: 30     # independent composite calls needed before storing a confidence map
  band_min_count: 10            # independent calls a band needs before it recalibrates a raw confidence
  # The autopilot gates on the LOWER confidence bound of a band's hit rate
  # (Wilson, over its independent calls), not the point estimate shown on the
  # Signals card. Gating on the estimate let a raw 6% QQQ signal clear the 55%
  # gate because its band was right 56% of the time over just 41 calls (90%
  # lower bound ~43%). 1.645 = one-sided 90%; 0 = gate on the point estimate.
  gate_lower_bound_z: 1.645

exit_rules:
  profit_target_pct: 50
  stop_loss_pct: -30
  time_cutoff_minutes_before_close: 30
  reversal_confidence_pct: 60
  # Trailing stop: let a winner run, then lock it in. Once the premium has been
  # up trailing_activate_pct from entry, exit if it gives back trailing_stop_pct
  # from that peak. (Set either to null to disable.)
  trailing_activate_pct: 40
  trailing_stop_pct: 20
  # Theta-aware late-session stop: in the last late_session_minutes before the
  # close, cut a position still down at least late_session_stop_pct (0DTE decay
  # accelerates, so a lingering loser is usually dead premium). null to disable.
  late_session_minutes: 90
  late_session_stop_pct: -20

database:
  # The live database is OUTSIDE the OneDrive-synced project folder on purpose:
  # it's written every minute, and OneDrive locking it (or its -wal/-shm files)
  # mid-write can fail a commit, while its cloud copy is never a consistent
  # snapshot. ~ and %VARS% expand; a relative path is from the project root.
  # The Web Push key (vapid_private.pem) lives beside it. ZERODTE_DB_PATH
  # overrides this (tests, a second instance on a copy).
  #
  # NOT under AppData: Windows redirects a packaged app's writes to AppData into
  # a private per-app folder. Tools run from inside such an app (the Claude
  # desktop app, for one) would then see a different file than the scheduled
  # tasks - the first move to AppData\Local\0DTE did exactly that, and the
  # tasks started on an empty database.
  path: "~/0DTE-data/0dte.db"
  # Nightly backups stay in the synced folder: each is written once, closed and
  # never touched again, so OneDrive syncs them safely - off-machine copies.
  backup_dir: "storage/backups"
