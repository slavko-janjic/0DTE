name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      # The suite is offline by design: market data is monkeypatched or absent,
      # and the API tests run against a temp database via ZERODTE_DB_PATH.
      - run: python -m pytest -q
